<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habit Pulse</title>
<style>
:root{--bg:#090e11;--bg2:#0f171b;--card:#131d22;--line:#1e2d34;--tx:#e7f2f4;--mu:#8ba2aa;--cy:#22d3ee;--dc:#0e7490;--sea:#2fbf8f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 480px at 85% -10%,#0b2c35,transparent),var(--bg);color:var(--tx);font:15px/1.5 "Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif}
h1{font-size:1.7rem;margin:0;font-weight:600;letter-spacing:-.01em}h2{font-size:1.05rem;margin:22px 0 10px;font-weight:600}h3{margin:0 0 12px}
button,input,select{font:inherit;color:inherit}
button{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer;transition:border-color .15s}
button:hover{border-color:var(--dc)}button:disabled{opacity:.5;cursor:wait}
.pri{background:linear-gradient(135deg,var(--cy),#0aa6c4);color:#031a20;border:0;font-weight:600}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;width:100%}
label{display:block;margin-bottom:10px;color:var(--mu);font-size:.9rem}label input,label select{margin-top:4px;color:var(--tx)}
[hidden]{display:none!important}.mu,small{color:var(--mu)}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*:first-child{flex:1}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}#auth .card{width:100%;max-width:380px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1}.tabs [aria-selected=true]{border-color:var(--cy);color:var(--cy)}
.err{color:#fca5a5;min-height:1.3em;margin:6px 0}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px}
nav .brand{font-weight:700;color:var(--cy);padding:4px 12px 16px;font-size:1.1rem}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;min-height:44px}
nav a[aria-current]{background:rgba(14,116,144,.35);color:var(--tx)}
nav .sp{flex:1}#dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block;margin-right:6px}#dot.on{background:var(--sea)}
main{padding:26px;max-width:1000px;width:100%;margin:auto}
.msg{background:rgba(14,116,144,.2);border:1px solid var(--dc);border-radius:12px;padding:10px 14px}
.ring{position:relative;width:140px;height:140px;margin:auto}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--cy);transition:stroke-dasharray .6s}.ring .ok{stroke:var(--sea)}
.big{font-size:2rem;font-weight:600;line-height:1.1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--c,var(--cy));border-radius:6px;transition:width .5s}
.sub .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-weight:700}
.sub .row>*:first-child{min-width:0}.sub b{display:block}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;border-color:var(--cy)}.clk{font-size:1.6rem;font-variant-numeric:tabular-nums;flex:1}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--line)}.dots .q{background:var(--sea)}
.cols{display:flex;gap:4px;align-items:flex-end;height:120px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--mu)}.cols i{display:block;width:100%;background:var(--cy);border-radius:4px 4px 0 0;min-height:2px}.cols .d i{background:var(--sea)}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:6px}.heat i{border-radius:3px;background:var(--line)}
.l1{background:#0b4a58!important}.l2{background:#0e7490!important}.l3{background:#22b8d4!important}.l4{background:var(--sea)!important}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.item>span{flex:1}.item button{min-height:36px;padding:4px 10px}
details summary{cursor:pointer;min-height:32px}.ch{margin:6px 0}.ch select{width:130px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--dc);border-radius:16px;max-width:400px;width:92%}dialog::backdrop{background:rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:20;width:max-content;max-width:92vw}
#toast div{background:#0e3a45;border:1px solid var(--cy);padding:10px 16px;border-radius:12px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:720px){#app{display:block}nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px;z-index:5}nav .brand,nav .sp{display:none}nav a{flex-direction:column;gap:0;font-size:.75rem;padding:6px 10px}main{padding:18px 14px 96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" class="mu" style="min-height:100vh;display:grid;place-items:center">Loading…</div>
<div id="auth" hidden><div class="card">
  <h1 style="color:var(--cy)">Habit Pulse</h1><p class="mu">Show up a little each day. Your progress stays.</p>
  <div class="tabs" role="tablist"><button id="t-in" role="tab" aria-selected="true">Sign in</button><button id="t-up" role="tab" aria-selected="false">Create account</button></div>
  <form id="af" novalidate>
    <label>Username<input id="un" autocomplete="username" autocapitalize="none" maxlength="24"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password"></label>
    <p id="note" class="mu" hidden><small>There is no email recovery. If you forget your password, the account can't be reset.</small></p>
    <p class="err" id="err" role="alert"></p>
    <button class="pri" id="sub" style="width:100%">Sign in</button>
  </form>
</div></div>
<div id="app" hidden>
  <nav aria-label="Main">
    <div class="brand">Habit Pulse</div>
    <a href="#dash" data-v="dash">◔ <span>Dashboard</span></a>
    <a href="#habits" data-v="habits">✓ <span>Daily Habits</span></a>
    <a href="#progress" data-v="progress">▦ <span>Progress</span></a>
    <a href="#settings" data-v="settings">⚙ <span>Settings</span></a>
    <div class="sp"></div><small><i id="dot"></i><span id="dtx">connecting</span></small>
  </nav>
  <main id="main" tabindex="-1">Loading…</main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" aria-live="polite"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getDatabase,ref,onValue,update,get,push,query,orderByKey,startAt} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

/* ===== FIREBASE CONFIG (replace if you use another project) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyAE1xdG_prufAMiBLdkQfwHqJokCjYORUQ",authDomain:"habit-pulse-rg.firebaseapp.com",databaseURL:"https://habit-pulse-rg-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"habit-pulse-rg",appId:"1:592280103446:web:3b74a69899e6f804eb2337"};
const app=initializeApp(FIREBASE_CONFIG),auth=getAuth(app),db=getDatabase(app);

/* Usernames map to synthetic emails: "name" -> "name@habitpulse.invalid" (.invalid is a reserved TLD, never deliverable).
   Firebase enforces unique emails, so usernames are unique. Only Auth stores the password (hashed). */
const EMAIL=u=>u+'@habitpulse.invalid';
const AE={'auth/email-already-in-use':'That username is taken.','auth/invalid-credential':'Username or password is incorrect.','auth/user-not-found':'Username or password is incorrect.','auth/wrong-password':'Username or password is incorrect.','auth/weak-password':'Password must be at least 8 characters.','auth/network-request-failed':'Network problem. Check your connection and try again.','auth/operation-not-allowed':'Enable Email/Password sign-in in Firebase Authentication.','auth/too-many-requests':'Too many attempts. Wait a moment and try again.'};
const D=[['hindi','Hindi','अ','#5eead4',20],['math','Mathematics','∑','#22d3ee',60],['science','Science','⚛','#34d399',60],['social','Social Studies','◍','#38bdf8',30],['english','English','Aa','#7dd3fc',10]];
const QUAL=1200,ST={todo:'Not started',doing:'In progress',done:'Completed'};

/* ===== utils: all dates are LOCAL dates (YYYY-MM-DD) ===== */
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>key(new Date());
const add=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return key(new Date(y,m-1,d+n))};
const num=k=>{const[y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`};
const clk=s=>[s/3600|0,(s/60|0)%60,s%60].map(pad).join(':');
function toast(t){const e=document.createElement('div');e.textContent=t;$('toast').append(e);setTimeout(()=>e.remove(),4500)}

/* ===== state & data ===== */
const S={uid:null,user:null,habits:{},daily:{},sessions:{},chapters:{},profile:{},ready:0,view:'dash',online:false,open:{},win:''};
let unsubs=[],busy=0,mode='in',seeding=0;
const H=()=>Object.entries(S.habits).filter(([,h])=>!h.archived).map(([id,h])=>({id,...h})).sort((a,b)=>a.order-b.order);
const sec=(h,d)=>S.daily[d]?.bySubject?.[h.id]||0;
const tgt=(h,d)=>d===today()?h.targetMinutes:(S.daily[d]?.targets?.[h.id]??h.targetMinutes);
const hp=(h,d)=>Math.min(100,Math.floor(sec(h,d)/(tgt(h,d)*60)*100));
const tot=d=>S.daily[d]?.seconds||0,q=d=>tot(d)>=QUAL;
function streaks(){const t=today();let c=0,k=q(t)?t:add(t,-1);while(q(k)){c++;k=add(k,-1)}
  let best=0,run=0,prev=null;for(const d of Object.keys(S.daily).sort())if(q(d)){run=prev&&num(d)-num(prev)===1?run+1:1;prev=d;best=Math.max(best,run)}
  return{cur:c,best:Math.max(best,c)}}
function cons(){const t=today();let n=0;for(let i=0;i<30;i++)if(q(add(t,-i)))n++;
  const created=num(key(new Date(S.profile.createdAt||Date.now())));
  const den=Math.min(30,Math.max(1,num(t)-created+(q(t)?1:0)));return{n,den:den,pct:Math.min(100,Math.round(n/den*100))}}
function overall(d){const hs=H();const goal=hs.reduce((a,h)=>a+tgt(h,d),0)*60||1;
  const got=hs.reduce((a,h)=>a+Math.min(sec(h,d),tgt(h,d)*60),0);return{pct:Math.floor(got/goal*100),goal:goal/60}}

/* ===== writes: one atomic multi-path update; daily summary is always recomputed from that day's sessions ===== */
async function W(u){const p=update(ref(db,'users/'+S.uid),u);if(S.online)await p;else{p.catch(()=>{});toast('Offline: saved on this device, will sync when reconnected.')}}
async function run(fn){if(busy)return;busy=1;try{await fn()}catch(e){toast(e.code?'Could not save ('+e.code+').':e.message)}finally{busy=0}}
async function commit(ch){const u={},hs=H();
  for(const d of new Set(ch.map(c=>c.d))){
    const base=d>=S.win?{...(S.sessions[d]||{})}:((await get(ref(db,`users/${S.uid}/sessions/${d}`))).val()||{});
    for(const c of ch.filter(c=>c.d===d)){c.rec?base[c.id]=c.rec:delete base[c.id];u[`sessions/${d}/${c.id}`]=c.rec||null}
    const by={};let s=0;for(const r of Object.values(base)){by[r.habitId]=(by[r.habitId]||0)+r.seconds;s+=r.seconds}
    const old=S.daily[d];u['daily/'+d]=s?{seconds:s,bySubject:by,targets:old?.targets||Object.fromEntries(hs.map(h=>[h.id,h.targetMinutes]))}:null;
    if(d===today()&&s){const was=old?.bySubject||{};let all=true;
      for(const h of hs){const hit=(by[h.id]||0)>=h.targetMinutes*60;if(!hit)all=false;
        if(hit&&(was[h.id]||0)<h.targetMinutes*60)toast(`${h.name} target reached. Nice work.`)}
      if(all&&hs.length&&!hs.every(h=>(was[h.id]||0)>=h.targetMinutes*60))toast('All of today’s targets are done. That’s steady progress.');
      else if(s>=QUAL&&(old?.seconds||0)<QUAL)toast('Today counts toward your streak.')}}
  await W(u)}

/* ===== timer: elapsed = acc + (now - run). Persisted per user in localStorage. ===== */
const TK=()=>'hp_t_'+S.uid,getT=()=>{try{return JSON.parse(localStorage.getItem(TK()))}catch{return null}};
const setT=t=>t?localStorage.setItem(TK(),JSON.stringify(t)):localStorage.removeItem(TK());
const el=t=>Math.floor(((t.acc||0)+(t.run?Date.now()-t.run:0))/1000);
function chk(t){if(t.run&&Date.now()-t.hb>18e4){t.acc+=t.hb-t.run;t.run=null;t.int=1;setT(t);return 1}}
setInterval(()=>{if(!S.uid)return;const t=getT();if(!t)return;if(chk(t)){toast('A session was interrupted. Only time up to the last check-in was kept.');return render()}
  if(t.run&&Date.now()-t.hb>15e3){t.hb=Date.now();setT(t)}const c=$('tclock');if(c)c.textContent=clk(el(t))},1000);

/* ===== views ===== */
const V={};
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
function msg(){const t=today(),s=tot(t),m=Math.floor(s/60),keys=Object.keys(S.daily).sort();
  if(!keys.length)return'Your first session is the hardest. Even 20 minutes starts a streak.';
  const o=overall(t);if(o.pct>=100)return'Every target is done today. That is consistency paying off.';
  if(s>=QUAL)return`Today counts: ${m} minutes in. Anything more is a bonus.`;
  if(s>0)return`${m} minutes in. ${Math.ceil((QUAL-s)/60)} more makes today count toward your streak.`;
  const last=keys[keys.length-1];if(num(t)-num(last)>1){const all=Object.values(S.daily).reduce((a,d)=>a+d.seconds,0);return`Welcome back. Your ${dur(all)} of study is still here. One short session picks things up.`}
  return'A short session is enough to get started today.'}
const timerBar=()=>{const t=getT();if(!t)return'';const h=S.habits[t.id];
  return`<div class="card tb"><b>${esc(h?.name||'Session')}</b><span id="tclock" class="clk">${clk(el(t))}</span>${t.run?'<button data-a="pause">Pause</button>':'<button data-a="resume">Resume</button>'}<button class="pri" data-a="finish">Finish and save</button><button data-a="discard">Discard</button>${t.int?'<small style="width:100%">Interrupted. Only time up to the last check-in was kept.</small>':''}</div>`};
const card=h=>{const t=today(),p=hp(h,t),m=Math.floor(sec(h,t)/60);
  return`<article class="card sub" style="--c:${h.color}"><div class="row"><span class="ico" aria-hidden="true">${esc(h.icon)}</span><div><b>${esc(h.name)}</b><small>${m} / ${h.targetMinutes} min · ${p>=100?'Done':p>0?'In progress':'Not started'}</small></div><b>${p}%</b></div>
  <div class="bar" role="progressbar" aria-label="${esc(h.name)} progress" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
  <div class="row"><button data-a="start" data-id="${h.id}">▶ Start</button><button data-a="add" data-id="${h.id}">+ Add time</button></div></article>`};
function bars(n){const t=today(),hs=H(),goal=hs.reduce((a,h)=>a+h.targetMinutes,0),days=[];
  for(let i=n-1;i>=0;i--)days.push(add(t,-i));const mx=Math.max(goal,...days.map(d=>tot(d)/60),1);
  if(!Object.keys(S.daily).length)return'<p class="mu">No sessions yet. Your days will appear here.</p>';
  return`<div class="cols" role="img" aria-label="Study minutes per day, last ${n} days">${days.map(d=>{const m=Math.round(tot(d)/60);return`<div class="${m>=goal?'d':''}" title="${d}: ${m} min"><i style="height:${m/mx*100}%"></i>${n<=7?new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'narrow'}):''}</div>`}).join('')}</div><small>Green marks days that met every target (${goal} min).</small>`}
function recent(n,ctl){const l=[];for(const[d,m]of Object.entries(S.sessions))for(const[id,r]of Object.entries(m))l.push({d,id,...r});
  l.sort((a,b)=>b.endedAt-a.endedAt);if(!l.length)return'<p class="mu">Nothing logged yet. Start a timer or add time you studied away from the screen.</p>';
  return l.slice(0,n).map(r=>`<div class="item"><span>${esc(r.habitName)} <small>${r.d} · ${dur(r.seconds)}${r.notes?' · '+esc(r.notes):''}</small></span>${ctl?`<button data-a="edit" data-d="${r.d}" data-id="${r.id}">Edit</button><button data-a="del" data-d="${r.d}" data-id="${r.id}">Delete</button>`:''}</div>`).join('')}
V.dash=()=>{const t=today(),o=overall(t),{cur,best}=streaks(),c=cons(),dots=[];
  for(let i=29;i>=0;i--){const d=add(t,-i);dots.push(`<i class="${q(d)?'q':''}" title="${d}"></i>`)}
  return`<h1>${greet()}</h1><p class="mu">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><p class="msg">${msg()}</p>${timerBar()}
  <section class="g"><div class="card" style="text-align:center"><div class="ring" role="progressbar" aria-label="Overall progress today" aria-valuenow="${o.pct}" aria-valuemin="0" aria-valuemax="100"><svg width="140" height="140"><circle class="bg" cx="70" cy="70" r="56"/><circle class="fg ${o.pct>=100?'ok':''}" cx="70" cy="70" r="56" stroke-dasharray="${o.pct*3.5186} 352"/></svg><b>${o.pct}%</b></div><p style="margin:8px 0 0"><b>${dur(tot(t))}</b> of ${dur(o.goal*60)} today</p></div>
  <div class="card"><div class="mu">Current streak</div><div class="big">${cur} ${cur===1?'day':'days'}</div><p class="mu">Longest: ${best} ${best===1?'day':'days'}. A day counts at 20 minutes.</p></div>
  <div class="card"><div class="mu">Last 30 days</div><div class="big">${c.pct}%</div><small>${c.n} of ${c.den} days counted</small><div class="dots" role="img" aria-label="${c.n} qualifying days in the last 30">${dots.join('')}</div></div></section>
  <h2>Today’s subjects</h2><div class="g">${H().map(card).join('')}</div>
  <div class="g2"><div class="card"><h3>Last 7 days</h3>${bars(7)}</div><div class="card"><h3>Recent activity</h3>${recent(5,false)}</div></div>`};
const chap=h=>{const cs=Object.entries(S.chapters[h.id]||{}),dn=cs.filter(([,c])=>c.status==='done').length;
  return`<details class="card" data-o="${h.id}" ${S.open[h.id]?'open':''}><summary>${esc(h.icon)} ${esc(h.name)} <small>· ${dn}/${cs.length} chapters completed</small></summary>
  ${cs.map(([id,c])=>`<div class="row ch"><span>${esc(c.title)}</span><select data-ch="${h.id}|${id}" aria-label="Status of ${esc(c.title)}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v}</option>`).join('')}</select><button data-a="chren" data-k="${h.id}|${id}" aria-label="Rename">✎</button><button data-a="chdel" data-k="${h.id}|${id}" aria-label="Remove">✕</button></div>`).join('')||'<p class="mu">No chapters yet. Add the first one below.</p>'}
  <form data-f="ch" data-h="${h.id}" class="row"><input name="t" placeholder="Add a chapter" maxlength="80" required aria-label="Chapter name"><button class="pri">Add</button></form></details>`};
V.habits=()=>`<h1>Daily habits</h1>${timerBar()}<div class="g" style="margin-top:14px">${H().map(card).join('')}</div>
  <h2>Session log</h2><div class="card">${recent(30,true)}</div><h2>Chapters</h2><div class="g">${H().map(chap).join('')}</div>`;
V.progress=()=>{const t=today(),hs=H(),{best}=streaks();let all=0,days=0,bestD=0;const bySub={};
  for(const[d,v]of Object.entries(S.daily)){all+=v.seconds;days++;bestD=Math.max(bestD,v.seconds);for(const[k,s]of Object.entries(v.bySubject||{}))bySub[k]=(bySub[k]||0)+s}
  const cells=[],dow=(new Date().getDay()+6)%7,start=add(t,-(25*7+dow));
  for(let i=0;i<25*7+dow+1;i++){const d=add(start,i),m=Math.floor(tot(d)/60),l=m>=120?4:m>=60?3:m>=20?2:m>0?1:0;cells.push(`<i class="${l?'l'+l:''}" role="img" aria-label="${d}: ${m} minutes" title="${d}: ${m} min"></i>`)}
  let chd=0,cht=0;for(const m of Object.values(S.chapters))for(const c of Object.values(m)){cht++;if(c.status==='done')chd++}
  const mx=Math.max(...Object.values(bySub),1);
  return`<h1>Progress</h1><div class="card" style="margin-top:14px"><h3>Activity, last 26 weeks</h3><div class="heat">${cells.join('')}</div><small>Darker to green = more minutes (1–19, 20–59, 60–119, 120+). Weeks start on Monday.</small></div>
  <section class="g2"><div class="card"><h3>Totals (last 13 months)</h3><div class="item"><span>Total study time</span><b>${dur(all)}</b></div><div class="item"><span>Days with study</span><b>${days}</b></div><div class="item"><span>Longest streak</span><b>${best} days</b></div><div class="item"><span>Best single day</span><b>${dur(bestD)}</b></div><div class="item"><span>Chapters completed</span><b>${chd} of ${cht}</b></div></div>
  <div class="card"><h3>Time by subject</h3>${hs.map(h=>`<div style="--c:${h.color}"><div class="row"><span>${esc(h.name)}</span><small>${dur(bySub[h.id]||0)}</small></div><div class="bar"><i style="width:${(bySub[h.id]||0)/mx*100}%"></i></div></div>`).join('')}</div></section>
  <div class="card" style="margin-top:14px"><h3>Daily minutes, last 30 days</h3>${bars(30)}</div>`};
V.settings=()=>`<h1>Settings</h1><section class="card" style="margin-top:14px"><div class="row"><span><b>${esc(S.profile.username||S.user.email.split('@')[0])}</b><br><small>Signed in</small></span><button data-a="logout">Log out</button></div></section>
  <h2>Subjects and daily targets</h2><div class="card">${H().map(h=>`<div class="row" style="margin-bottom:8px"><input data-hn="${h.id}" value="${esc(h.name)}" maxlength="40" aria-label="Subject name"><input data-ht="${h.id}" type="number" min="1" max="600" value="${h.targetMinutes}" style="width:90px" aria-label="Daily target minutes"><button data-a="hdel" data-id="${h.id}">Remove</button></div>`).join('')}
  <form data-f="hab" class="row"><input name="n" placeholder="New subject" maxlength="40" required aria-label="New subject name"><input name="m" type="number" min="1" max="600" value="30" style="width:90px" aria-label="Target minutes"><button class="pri">Add</button></form>
  <p class="mu"><small>Changing a target applies from today. Past days keep the target they were recorded with. Removing a subject hides it but keeps its history.</small></p></div>
  <h2>Time zone policy</h2><div class="card"><p>Days follow this device’s local time (<b>${Intl.DateTimeFormat().resolvedOptions().timeZone}</b>). Each session stores the local date it was recorded on, so travelling never moves old sessions. A day counts toward your streak at 20 minutes of study. Missing a day never removes past progress.</p></div>`;
function render(){if(!S.uid)return;const m=$('main');document.querySelectorAll('nav a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===S.view));
  m.innerHTML=S.ready?V[S.view]():'Loading…'}

/* ===== dialogs ===== */
function sessDlg(o){const hs=Object.entries(S.habits).filter(([i,h])=>!h.archived||i===o.h);const id=o.id||push(ref(db)).key;
  $('dlg').innerHTML=`<form data-f="sess"><h3>${o.id?'Edit session':'Add study time'}</h3><label>Subject<select name="h">${hs.map(([i,h])=>`<option value="${i}" ${i===o.h?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label>
  <label>Minutes<input name="m" type="number" min="1" max="720" required value="${o.m||''}"></label><label>Date<input name="d" type="date" required min="${add(today(),-365)}" max="${today()}" value="${o.d||today()}"></label>
  <label>Notes (optional)<input name="n" maxlength="300" value="${esc(o.n||'')}"></label><input type="hidden" name="id" value="${id}"><input type="hidden" name="od" value="${o.o||''}">
  <div class="row"><button type="button" data-a="close">Cancel</button><button class="pri">Save</button></div></form>`;$('dlg').showModal()}

/* ===== events ===== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,d=b.dataset.d;
  if(a==='close')return $('dlg').close();
  if(a==='logout')return signOut(auth);
  if(a==='start'){if(getT())return toast('Finish or discard the current session first.');setT({id,start:Date.now(),acc:0,run:Date.now(),hb:Date.now()});return render()}
  if(a==='pause'||a==='resume'){const t=getT();if(!t)return;if(a==='pause'){t.acc+=Date.now()-t.run;t.run=null}else{t.run=Date.now();t.hb=t.run;delete t.int}setT(t);return render()}
  if(a==='discard'){if(confirm('Discard this session? The time will not be saved.')){setT(null);render()}return}
  if(a==='finish')return run(async()=>{const t=getT();if(!t)return;const s=el(t),h=S.habits[t.id];
    if(s<30){setT(null);render();return toast('Under 30 seconds, so nothing was saved.')}
    const sid=push(ref(db)).key;await commit([{d:today(),id:sid,rec:{habitId:t.id,habitName:h?.name||'Study',seconds:s,startedAt:t.start,endedAt:Date.now(),source:'timer'}}]);setT(null);render();toast('Session saved.')});
  if(a==='add')return sessDlg({h:id});
  if(a==='edit'){const r=S.sessions[d]?.[id];if(r)sessDlg({id,h:r.habitId,m:Math.round(r.seconds/60),d,o:d,n:r.notes})}
  if(a==='del'&&confirm('Delete this session? Totals and streaks will be recalculated.'))return run(()=>commit([{d,id,rec:null}]));
  if(a==='chren'){const[h,c]=b.dataset.k.split('|'),n=prompt('Rename chapter',S.chapters[h]?.[c]?.title);if(n&&n.trim())run(()=>W({[`chapters/${h}/${c}/title`]:n.trim().slice(0,80),[`chapters/${h}/${c}/updatedAt`]:Date.now()}))}
  if(a==='chdel'){const[h,c]=b.dataset.k.split('|');if(confirm('Remove this chapter?'))run(()=>W({[`chapters/${h}/${c}`]:null}))}
  if(a==='hdel'&&confirm('Remove this subject? Its history is kept.'))run(()=>W({[`habits/${id}/archived`]:true}));
});
document.addEventListener('toggle',e=>{const o=e.target.dataset?.o;if(o)S.open[o]=e.target.open},true);
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.ch){const[h,c]=t.dataset.ch.split('|'),n=Date.now(),u={[`chapters/${h}/${c}/status`]:t.value,[`chapters/${h}/${c}/updatedAt`]:n,[`chapters/${h}/${c}/completedAt`]:t.value==='done'?n:null};
    run(async()=>{await W(u);if(t.value==='done')toast('Chapter completed. That’s a real milestone.')})}
  if(t.dataset.ht){const v=Math.round(+t.value);if(!(v>=1&&v<=600)){toast('Target must be 1–600 minutes.');return render()}run(()=>W({[`habits/${t.dataset.ht}/targetMinutes`]:v}))}
  if(t.dataset.hn){const v=t.value.trim().slice(0,40);if(!v)return render();run(()=>W({[`habits/${t.dataset.hn}/name`]:v}))}});
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const F=new FormData(f);
  if(k==='sess')run(async()=>{const m=Math.round(+F.get('m')),d=F.get('d'),id=F.get('id'),od=F.get('od'),h=S.habits[F.get('h')];
    if(!(m>=1&&m<=720)||!h||!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>today()||d<add(today(),-365))return toast('Check the minutes and date.');
    const old=od?S.sessions[od]?.[id]:null,n=F.get('n').trim(),rec={habitId:F.get('h'),habitName:h.name,seconds:m*60,startedAt:old?.startedAt||Date.now(),endedAt:old?.endedAt||Date.now(),source:old?.source||'manual'};
    if(n)rec.notes=n;const ch=[];if(od&&od!==d)ch.push({d:od,id,rec:null});ch.push({d,id,rec});
    await commit(ch);$('dlg').close();toast(od?'Session updated.':'Time added.')});
  if(k==='ch'){const t=F.get('t').trim();if(!t)return;const id=push(ref(db)).key,h=f.dataset.h;S.open[h]=true;run(()=>W({[`chapters/${h}/${id}`]:{title:t.slice(0,80),status:'todo',updatedAt:Date.now()}}))}
  if(k==='hab'){const hs=Object.values(S.habits),pal=['#5eead4','#22d3ee','#34d399','#38bdf8','#7dd3fc','#2dd4bf'],id=push(ref(db)).key;
    run(()=>W({['habits/'+id]:{name:F.get('n').trim().slice(0,40),icon:'●',color:pal[hs.length%6],targetMinutes:Math.min(600,Math.max(1,Math.round(+F.get('m')))),order:Math.max(-1,...hs.map(h=>h.order))+1}}))}});
window.addEventListener('hashchange',route);
function route(){const v=location.hash.slice(1);S.view=V[v]?v:'dash';render();if(S.uid)scrollTo(0,0)}

/* ===== auth ===== */
const err=t=>$('err').textContent=t;
function setMode(m){mode=m;$('t-in').setAttribute('aria-selected',m==='in');$('t-up').setAttribute('aria-selected',m==='up');$('sub').textContent=m==='in'?'Sign in':'Create account';$('note').hidden=m==='in';$('pw').autocomplete=m==='in'?'current-password':'new-password';err('')}
$('t-in').onclick=()=>setMode('in');$('t-up').onclick=()=>setMode('up');
$('af').onsubmit=async e=>{e.preventDefault();const u=$('un').value.trim().toLowerCase(),p=$('pw').value;err('');
  if(!/^[a-z0-9._-]{3,24}$/.test(u))return err('Username: 3–24 characters using letters, numbers, . _ -');
  if(!p||(mode==='up'&&p.length<8))return err('Password must be at least 8 characters.');
  $('sub').disabled=true;
  try{mode==='up'?await createUserWithEmailAndPassword(auth,EMAIL(u),p):await signInWithEmailAndPassword(auth,EMAIL(u),p);$('pw').value=''}
  catch(x){err(AE[x.code]||'Something went wrong ('+(x.code||x.message)+').')}
  $('sub').disabled=false};
const show=w=>{$('splash').hidden=w!=='splash';$('auth').hidden=w!=='auth';$('app').hidden=w!=='app'};
async function seed(){if(seeding)return;seeding=1;const b='users/'+S.uid;
  try{if((await get(ref(db,b+'/profile/seeded'))).val())return;const habits={};D.forEach((d,i)=>habits[d[0]]={name:d[1],icon:d[2],color:d[3],targetMinutes:d[4],order:i});
    await update(ref(db,b),{profile:{username:S.user.email.split('@')[0],createdAt:Date.now(),seeded:true},habits})}
  catch(e){toast('Could not set up your account data ('+(e.code||'error')+'). Reload to retry.');seeding=0}}
function boot(){const b=`users/${S.uid}/`,L=(p,fn,from)=>unsubs.push(onValue(from?query(ref(db,b+p),orderByKey(),startAt(from)):ref(db,b+p),s=>{fn(s.val()||{});render()},e=>toast('Could not load '+p+' ('+e.code+').')));
  S.win=add(today(),-14);
  L('profile',v=>{S.profile=v;if(!v.seeded)seed()});L('habits',v=>{S.habits=v;S.ready=1});
  L('daily',v=>S.daily=v,add(today(),-400));L('sessions',v=>S.sessions=v,S.win);L('chapters',v=>S.chapters=v);
  const t=getT();if(t&&chk(t))toast('A session was interrupted. Only time up to the last check-in was kept.');route()}
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];Object.assign(S,{ready:0,habits:{},daily:{},sessions:{},chapters:{},profile:{}});seeding=0;
  if(!u){S.uid=null;show('auth');return}
  S.uid=u.uid;S.user=u;show('app');boot()});
onValue(ref(db,'.info/connected'),s=>{S.online=!!s.val();$('dot').className=S.online?'on':'';$('dtx').textContent=S.online?'online':'offline'});
</script>
</body>
</html>
